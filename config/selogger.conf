# selogger configuration. Every line is optional; the values below are the
# defaults. See README.md for what each key does.

# Where the journal lives.
#state_dir=/data/vendor/selogger

# Memory and disk bounds.
#max_tuples=20000
#max_hints=16
#journal_max_bytes=1048576

# When data is written: a new kind of denial after flush_delay_s, repeats of
# known ones every count_flush_interval_s.
#flush_delay_s=5
#count_flush_interval_s=3600

# Kernel audit rate limit (messages per second, 0 = unlimited) while
# collecting and when idle. Idle starts after idle_timeout_s without a new
# kind of denial; 0 never goes idle.
#collect_audit_rate=100
#idle_audit_rate=5
#idle_timeout_s=600
#start_collecting=true

# Read the kernel log for dropped-message reports.
#watch_audit_lost=true
